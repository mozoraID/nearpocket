name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: install, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pin npm 10
        run: npm install -g npm@10
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test (QRIS/EMVCo, i18n, Intents gate, shop order)
        run: npm test
      - name: Build with no env vars
        run: npm run build
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: ""
          XENDIT_SECRET_KEY: ""
          NEAR_INTENTS_EXECUTE: ""

  contract:
    name: agent-policy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test --manifest-path contracts/agent-policy/Cargo.toml -- --test-threads=1
      - name: OpenSSL headers for the sandbox client
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: build sandbox wasms
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path contracts/agent-policy/Cargo.toml --target wasm32-unknown-unknown --release
          cargo build --manifest-path contracts/test-ft/Cargo.toml --target wasm32-unknown-unknown --release
          cp contracts/agent-policy/target/wasm32-unknown-unknown/release/nearly_agent_policy.wasm contracts/agent-policy/res/nearly_agent_policy.wasm
      - name: sandbox escrow flow
        run: cargo test --manifest-path contracts/escrow-sandbox/Cargo.toml -- --test-threads=1
